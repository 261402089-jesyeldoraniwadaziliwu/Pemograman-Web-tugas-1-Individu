<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tugas3.css">
    
</head>
<body>  
    <div>
        <table>
            <!-- Bilangan 1 -->
            <tr>
                <td>Input Bilangan 1</td>
                <td><input type="number" id="bil1"></td>
            </tr>
            <!-- Bilangan 2 -->
            <tr>
                <td>Input Bilangan 2</td>
                <td><input type="number" id="bil2"></td>
            </tr>
        <tr>
        <td>
        <td>
            <button type="button" onclick="hitung('+')">+</button>
            <button type="button" onclick="hitung('-')">-</button>
            <button type="button" onclick="hitung('*')">*</button>
            <button type="button" onclick="hitung('/')">/</button>
        </td>
        </td>
       </tr>

       <tr>
        <td>Output</td>
        <td><input type="text" id="hasil" readonly></td>
       </tr>
    </table>
    </div>


    <!-- Hasil -->
<script>
    function hitung(operator){
        let a = parseFloat (document.getElementById("bil1").value);
        let b = parseFloat (document.getElementById("bil2").value);
        let hasil;
    
    if(operator == '+'){
        hasil = a + b;
    }

    if(operator == '-'){
        hasil = a - b;
    } 

    if(operator == '*'){
        hasil = a * b;
    }

    if(operator == '/'){
        hasil = a / b;
    }

    document.getElementById("hasil").value = hasil;
    }
</script>

</body>
</html>
