<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>    
</head>
<style>
body{
    font-family: Arial, sans-serif;
    background-color: rgb(230, 224, 224);
}

.container{
    width: 500px;
    margin: 30px auto;
    border: 1px solid rgb(39, 36, 36);
    background-color: rgb(210, 204, 204);
    padding: 20px;
}

h1{
    color: rgb(233, 80, 80);
    margin-bottom: 20px;
}

fieldset{
            border:none;
            min-width:200px;
        }


label{
    font-weight: bold;
    display:block;
    margin-top:15px;
    font-size:16px;
}


select{
            width:250px;
            padding:.5em;
            margin-top:5px;
}

.checks{
            margin-top:10px;
            margin-bottom:1em;
}

input{
            padding:.5em;
            border:solid 1px #999;
            margin-top:5px;
        }

        


input[type=submit]{
    background-color: #350c0c;
    color: rgb(172, 18, 18);
    border: none;
    padding: 10px 20px;
    background: #350c0c;
    font-size: 1em;
    border-radius: 5px;
}

    input[type=submit]:hover{
    background-color: #ffb7b7;
}

</style>
<body>

<div class="container">
    <h1>Daftar Akun Baru</h1>

    <form>
        <fieldset>

        <label>Username:</label><br>
        <input type="text" placeholder="Masukkan Username">
        <br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Masukkan Password">
        <br><br>

        <label>Alamat:</label><br>
        <textarea >Input alamat disini</textarea>
        <br><br>

        <label>Tanggal Lahir:</label><br>
        <textarea >Input Tanggal Lahir</textarea>
        <br><br>

        <label>Program Studi:</label><br>
        <select>
            <option>Pilih Program Studi</option>
            <option>Teknologi Informasi</option>
            <option>Sistem Informasi</option>
            <option>Ilmu Komputer</option>
            <option>Manajemen Informatika</option>
        </select>
        <br><br>

        <label>Jenis Kelamin:</label><br>
         <div class="checks">
        <label><input type="radio" name="jk"> Laki-laki</label>
        <label><input type="radio" name="jk"> Perempuan</label>
        </div>
      

        <label>Hobi:</label><br>
        <div class="checks"></div>
        <input type="checkbox"> Membaca
        <input type="checkbox"> Dengarkan Musik
        <input type="checkbox"> Olahraga
        <br><br>

        <input type="submit" value="Daftar">

    </form>
    </fieldset>
</div>

</body>
</html>
